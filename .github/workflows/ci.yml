name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://localhost:3300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install Chromium (retry apt/DNS flakes, then fall back)
        run: |
          # GitHub-hosted apt mirrors sometimes fail to resolve (exit 100).
          # Retry --with-deps twice; if the system packages still cannot be fetched,
          # install the browser alone (the runner image ships the usual libs).
          # A failure of the browser download itself is not hidden: the last
          # command has no fallback and fails the job.
          # Each attempt is capped: with DNS down, apt alone retries for many
          # minutes per run and would consume the whole job timeout.
          for attempt in 1 2; do
            timeout 150 npx playwright install --with-deps chromium && exit 0
            echo "playwright install --with-deps failed or timed out (attempt $attempt)"
            sleep $((attempt * 10))
          done
          echo "falling back to browser-only install"
          npx playwright install chromium
      - run: npm run build
      - name: Start production server
        run: |
          npx next start -p 3300 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "$BASE_URL/" && exit 0
            sleep 1
          done
          echo "server did not start"; cat next-start.log; exit 1
      - run: npm run e2e
      - run: npm run a11y
