    - region "A path back to life":
      - heading "A path back to life" [level=3]
      - text: 8 next steps
      - paragraph: Metadata and declared-dependency plan · no source code or vulnerability audit
      - group: Detected stack 1
      - group: Maintenance flags 4
      - group:
        - text: Revival steps 8
        - list:
          - listitem:
            - text: "01"
            - heading "Fork and clone the repository" [level=4]
            - paragraph: Fork example/abandoned-widget to your GitHub account and clone it locally. Create a new branch (e.g. "revival") to track your changes.
          - listitem:
            - text: "02"
            - heading "Update the README" [level=4]
            - paragraph: Replace or supplement the existing README with a revival notice. Document the original purpose, the revival date, and your plans for the project. Add badges for build status and license.
          - listitem:
            - text: "03"
            - heading "Upgrade react ^16.14.0 → 19.x (major behind)" [level=4]
            - paragraph: package.json declares react ^16.14.0; the registry's latest is 19.2.0. Read the changelog for breaking changes between 16.x and 19.x, upgrade on a branch, and run the tests.
          - listitem:
            - text: "04"
            - heading "Update 1 minor-behind package" [level=4]
            - paragraph: "Same major line, older floor: lodash ^4.17.0 → 4.17.21. These are usually low-risk; raise the declared floor and refresh the lockfile."
          - listitem:
            - text: "05"
            - heading "Review 2 packages Gravekeeper could not compare" [level=4]
            - paragraph: "Check these by hand: ghost-pkg (not on the registry), jest (Declared spec has no lower bound.)."
          - listitem:
            - text: "06"
            - heading "Set up continuous integration" [level=4]
            - paragraph: "Add or restore a CI workflow (GitHub Actions, CircleCI, etc.) that runs tests on every push. A minimal `.github/workflows/ci.yml` that installs dependencies and runs the test suite is sufficient to start."
          - listitem:
            - text: "07"
            - heading "Triage the 42 open issues" [level=4]
            - paragraph: Review open issues to identify quick wins, stale reports, and blockers. Close duplicates and issues that are no longer relevant. Label the rest by severity so new contributors can orient quickly.
          - listitem:
            - text: "08"
            - heading "Communicate revival intent" [level=4]
            - paragraph: The last commit was approximately 93 months ago. Post a brief "revival notice" in the project's issue tracker and (if applicable) package registry listing. Mention the transfer/fork so existing users know where to find updates.
    - region "Leave a paper trail":
      - heading "Leave a paper trail" [level=3]
      - text: Ed25519 + SHA-256
      - paragraph: 7 linked receipts record this lookup. Verify their signatures in your browser, then keep an export for later.
      - button "Verify proof"
      - button "Download proof"
      - status
      - status
      - group: 01 wayback be0bd5fcecca…
      - group: 02 wayback-cdx 5354255d62d3…
      - group: 03 github-meta 216abeb2b5af…
      - group: 04 github-commits 7804ce4fc662…
      - group: 05 github-manifest 5c21973a46d9…
      - group: 06 registry dae75bad02c4…
      - group: 07 spec 6728f97c9d4a…
      - paragraph: Integrity, not proof of authorship or source truth. Each lookup uses a fresh signing key included in the export. An exported chain cannot authenticate GitHub or the Internet Archive, or prove that later receipts were not removed.
    - region "Take the plan home":
      - heading "Take the plan home" [level=3]
      - text: Revival kit
