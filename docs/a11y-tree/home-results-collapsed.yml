    - region "Epitaph":
      - heading "Epitaph" [level=3]
      - text: Internet Archive capture index
      - paragraph: When the Internet Archive first and last captured this exact URL, and how many months of each year have at least one capture.
      - term: Born
      - definition: Jun 22, 2014
      - term: Last seen
      - definition: Apr 2019
      - term: Years on record
      - definition: 6 (5 with captures)
      - term: Captured months
      - definition: "6"
      - 'figure "Captured months per year from 2014 to 2019. Busiest year: 2014 with 2 of 12 months. Tall bars are busy years; short grey ticks are years with no captures."'
      - group: Show captures per year as a table
      - paragraph: Months are UTC; “last seen” is the latest month with a capture. The signed receipt shows this is what Gravekeeper received from the Archive, not that the Archive's index is complete or correct.
    - region "Dependency autopsy":
      - heading "Dependency autopsy" [level=3]
      - text: package.json · npm
      - paragraph: "Compares the lowest version each dependency declares with the latest release on the public registry. It reads declared versions only: no lockfile, no install, and it is not a vulnerability scan."
